<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Route | RTR River Trail Ride</title>
<meta name="description" content="See the RTR river trail route around Ipoh from above.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">

<!-- =====================================================================
     PART 1: CSS STYLING
     Edit colours, fonts and spacing here. The HTML below only uses classes.
     ===================================================================== -->
<style>

/* ---------- 1. Variables (same as index.html) ---------- */
:root{
  --accent:#E8B93A;
  --accent-focus:#F5731F;
  --ink:#0D2B2A;
  --river:#1B5E58;
  --panel:#14463F;
  --page:#EAF0EA;
  --text-muted:#3F5A57;
  --text-light:#EAF3EE;
  --text-light-muted:#B9D4CC;

  --font-body:'Inter',system-ui,sans-serif;
  --font-head:'Space Grotesk',sans-serif;

  --max-width:1240px;
  --gutter:24px;
  --radius-card:20px;
}

/* ---------- 2. Base ---------- */
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-body)}
a{color:inherit}
h1,h2,p{margin:0}
h1,h2{font-family:var(--font-head)}
:focus-visible{outline:3px solid var(--accent-focus);outline-offset:2px}

/* ---------- 3. Layout helpers ---------- */
.container{max-width:var(--max-width);margin:0 auto;padding:0 var(--gutter);box-sizing:border-box}

/* ---------- 4. Buttons ---------- */
.btn{display:inline-block;text-decoration:none;font-weight:600;border-radius:999px}
.btn:hover{filter:brightness(1.08)}
.btn-small{font-size:15px;padding:12px 22px;background:var(--accent);color:var(--ink)}
.btn-accent{font-size:17px;padding:16px 30px;background:var(--accent);color:var(--ink)}

/* ---------- 5. Header ---------- */
.header{background:var(--ink);color:var(--text-light)}
.nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-top:24px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo-mark{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--ink);font-family:var(--font-head);font-weight:700;font-size:18px}
.logo-name{font-family:var(--font-head);font-weight:600;font-size:18px;letter-spacing:0.01em}
.nav-links{display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;font-size:15px;font-weight:500}
.nav-link{text-decoration:none;padding:12px 0}
.nav-link:hover{text-decoration:underline}
.page-intro{padding-top:64px;padding-bottom:72px;text-align:center}
.page-title{font-weight:700;font-size:clamp(36px,5vw,60px);line-height:1.05;letter-spacing:-0.02em}
.page-text{margin:20px auto 0;max-width:600px;font-size:18px;line-height:1.6;color:var(--text-light-muted)}

/* ---------- 6. Satellite image area (big, centred) ---------- */
.map-section{padding-top:56px;padding-bottom:72px}
.map-frame{margin:0 auto;width:100%;max-width:1100px}
.map-box{position:relative;width:100%;aspect-ratio:16 / 10;overflow:hidden;background:var(--panel);border:2px dashed #5E9A91;border-radius:var(--radius-card);box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--text-light-muted);font-size:17px;line-height:1.5}
.map-box img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
.map-caption{margin-top:16px;text-align:center;font-size:15px;line-height:1.6;color:var(--text-muted)}

/* ---------- 7. Call to action ---------- */
.cta{padding-top:8px;padding-bottom:72px;text-align:center}
.cta-title{font-weight:700;font-size:clamp(28px,4vw,44px);line-height:1.1;letter-spacing:-0.015em}
.cta-actions{margin-top:28px}

/* ---------- 8. Footer ---------- */
.footer{background:var(--ink);color:var(--text-light-muted)}
.footer-inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px;padding-top:48px;padding-bottom:48px}
.footer-brand{display:flex;align-items:center;gap:12px}
.footer-name{font-family:var(--font-head);font-weight:600;font-size:18px;color:var(--text-light)}
.footer-tag{margin-top:2px;font-size:14px}
.footer-copy{font-size:14px}

</style>
</head>

<!-- =====================================================================
     PART 2: HTML CONTENT
     Image needed (same folder as this file): route-satellite.png
     ===================================================================== -->
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container">
      <nav class="nav">
        <a class="logo" href="index.html">
          <span class="logo-mark">RTR</span>
          <span class="logo-name">River Trail Ride</span>
        </a>
        </div>
      </nav>
    </div>
    <div class="container page-intro">
      <h1 class="page-title">The route</h1>
      <p class="page-text">See the river trail from above.</p>
    </div>
  </header>

  <!-- SATELLITE IMAGE -->
  <section class="container map-section">
    <figure class="map-frame" style="margin-left:auto;margin-right:auto">
      <div class="map-box">
        [cooming soon]
        <img src="route-satellite.png" alt="Satellite view of the RTR river trail route around Ipoh" onerror="this.remove()">
      </div>
      <figcaption class="map-caption">[~~~]</figcaption>
    </figure>
  </section>

  <!-- CALL TO ACTION -->
  <section class="container cta">
    <h2 class="cta-title">Ready to ride the river?</h2>
    <div class="cta-actions">
      <a class="btn btn-accent" href="index.html#book">Book a ride</a>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="logo-mark">RTR</span>
        <div>
          <div class="footer-name">River Trail Ride</div>
          <div class="footer-tag">27-29, Level 3, Wisma Han Kang, Jalan Tun Sambanthan, 30000 Ipoh, Perak</div>
        </div>
      </div>
      <div class="footer-copy">&copy; 2026 RTR River Trail Ride · Ipoh, Perak</div>
    </div>
  </footer>

</body>
</html>
